<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      // Let creates a new Variable 
      let var1 = 3;
      console.log(var1);

      let calc = 2+2 ;
      console.log(calc);

      console.log(calc+2);


      let result = calc+2;

      console.log(result);

      let message = 'hello';
      console.log(message);

      console.log(message); console.log(';');

      var1 = 5;
      console.log(var1);

      var1 = var1 + 1;
      console.log(var1);
    </script>
  </body>
</html>
