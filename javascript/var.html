<!DOCTYPE html>
<html>
  <head>
    <title>Variables</title>
  </head>
  <body>
    <script>
      // Let creates a new Variable 
      let var1 = 3;
      console.log(var1);

      const calc = 2+2 ;
      console.log(calc);

      console.log(calc+2);


      const result = calc+2;

      console.log(result);

      const message = 'hello';
      console.log(message);

      console.log(message); console.log(';');

      var1 = 5;
      console.log(var1);

      var1 = var1 + 1;
      console.log(var1);

      const var2 = 3;
      // cannot be changed 

      var var3 = 3;

      console.log(typeof var2);
      console.log(typeof message);
    
    </script>
  </body>
</html>
