<!DOCTYPE html>
<html>
  <head>
    <title>Rock-Paper-Scissors</title>
  </head>

  <body>

    <p>Rock Paper Scissors</p>

    <!-- ROCK -->
    <button onclick="
      playGame('rock');
    ">Rock</button>

    <!-- PAPER -->
    <button onclick="
      playGame('paper');
    ">Paper</button>

    <!-- SCISSORS -->
    <button onclick="
      playGame('scissors');
    ">Scissors</button>

    <p class="js-score"></p>

    <button onclick="
      reset();
    ">Reset Score</button>


    <script>

      // Get saved score from localStorage.
      // If there is no saved score, create a new score object.

      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };


      // Display score when page loads.
      displayScore();


      // ================= PLAY GAME =================

      function playGame(playerMove) {

        // Generate computer's move.
        const computerMove = pickComputerMove();

        let result = '';


        // ================= ROCK =================

        if (playerMove === 'rock') {

          if (computerMove === 'rock') {
            result = 'Tie.';
          }
          else if (computerMove === 'paper') {
            result = 'You lose.';
          }
          else if (computerMove === 'scissors') {
            result = 'You win.';
          }

        }


        // ================= PAPER =================

        else if (playerMove === 'paper') {

          if (computerMove === 'rock') {
            result = 'You win.';
          }
          else if (computerMove === 'paper') {
            result = 'Tie.';
          }
          else if (computerMove === 'scissors') {
            result = 'You lose.';
          }

        }


        // ================= SCISSORS =================

        else if (playerMove === 'scissors') {

          if (computerMove === 'rock') {
            result = 'You lose.';
          }
          else if (computerMove === 'paper') {
            result = 'You win.';
          }
          else if (computerMove === 'scissors') {
            result = 'Tie.';
          }

        }


        // ================= UPDATE SCORE =================

        if (result === 'You win.') {
          score.wins++;
        }
        else if (result === 'You lose.') {
          score.losses++;
        }
        else if (result === 'Tie.') {
          score.ties++;
        }


        // Save updated score.
        localStorage.setItem(
          'score',
          JSON.stringify(score)
        );


        // Display updated score.
        displayScore();


        // Show result.
        alert(
          `You picked ${playerMove}. Computer picked ${computerMove}. ${result}`
        );

      }


      // ================= COMPUTER MOVE =================

      function pickComputerMove() {

        let computerMove = '';

        const randomNumber = Math.random();

        if (randomNumber < 1 / 3) {
          computerMove = 'rock';
        }
        else if (randomNumber < 2 / 3) {
          computerMove = 'paper';
        }
        else {
          computerMove = 'scissors';
        }

        return computerMove;
      }


      // ================= DISPLAY SCORE =================

      function displayScore() {

        document.querySelector('.js-score').innerHTML =
          `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;

      }


      // ================= RESET SCORE =================

      function reset() {

        // Create a new score with all values set to 0.
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };


        // Save the reset score to localStorage.
        localStorage.setItem(
          'score',
          JSON.stringify(score)
        );


        // Update the score displayed on the page.
        displayScore();

      }

    </script>

  </body>
</html>
