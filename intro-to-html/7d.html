<!DOCTYPE html>
<html>
  <head>
    <style>
      .t1
      {
        width: 100%;
  max-width: 300px;
  padding: 12px 16px;         /* Adds breathing room inside the box */
  border: 1.5px solid #ccc;    /* Clean, light border color */
  border-radius: 8px;         /* Adjust this number to change roundness */
  outline: none;              /* Removes default browser outline */
  font-size: 16px; 
      }
      .t1:focus
      {
         border-color: #007bff;      /* Changes border to blue on click */
  box-shadow: 0 0 5px rgba(0, 123, 255, 0.2); /* Soft outer glow */
      }
    </style>
  </head>
  <body>
    <input class="t1" type="text" placeholder="Search">
  </body>
</html>
