<style>
 .h1head
 {
  background-color: antiquewhite;
  color: black;
  box-shadow: 0cqh;
  align-content: center;

 }


  .button
  {
    background-color: green;
    color: black;
    align-content: center;

  }



  /* CSS Styling */
.square {
  width: 100px;
  height: 100px;
  background-color: #3498db;
  margin-bottom: 20px;
  margin-top: 20px;
}

.circle {
  width: 100px;
  height: 100px;
  background-color: #e74c3c;
  border-radius: 50%; /* Makes the square a circle */
  margin-bottom: 20px;
}

.triangle {
  width: 0;
  height: 0;
  border-left: 50px solid transparent;
  border-right: 50px solid transparent;
  border-bottom: 100px solid #2ecc71; /* Creates the triangle */
  margin-bottom: 20px;
}

.moving-circle {
  width: 100px;
  height: 80px;
  background-color: #e74c3c;
  border-radius: 50%;
  margin-bottom: 20px;
  /* Name, duration, timing function, repetition */
  animation: floatAround 3s ease-in-out infinite alternate;
}

@keyframes floatAround {
  0% { transform: translateX(0) scale(1); }
  100% { transform: translateX(150px) scale(1.2); }
}

.morph-shape {
  /* Defines which property to animate and how long it takes */
  transition: rx 0.5s ease, fill 0.5s ease;
  margin-top: 20px;
}

.morph-shape:hover {
  rx: 50%; /* Rounds the corners of the SVG rect */
  fill: #2ecc71; /* Changes color */
}





</style>
<!DOCTYPE html>
<html>
  <head>
    mywebsite
  </head>

<body>
<h1 class="h1head"> this is a heading with h1 tag</h1>
<p class="para">this is a paragraph</p>
<button class="button"> green button</button>


<!-- HTML Structure -->
<div class="square"></div>
<div class="circle"></div>
<div class="triangle"></div>

<div class="moving-circle"></div>

<svg width="100" height="100">
  <rect class="morph-shape" width="100" height="100" fill="#3498db" />
</svg>



</body>

</html>
